[project]
name = "self-weighting-graphones"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "torch==2.12.1",
    "numpy==2.5.1",
    "pyarrow==24.0.0",
    "phonemizer==3.4.0",
    "huggingface-hub==2.3.0",
    "scipy==1.16.3",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.0",
    "pytest==9.1.1",
    "hypothesis==6.167.0",
    "ruff==0.16.6",
]
figures = [
    "matplotlib==3.10.7",
]

[tool.uv]
default-groups = ["dev", "figures"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["artefacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = [
    "models",
    "data",
    "experiments",
    "framework",
    "workers",
    "orchestrator",
    "pipeline",
    "figures",
    "unit-tests",
]
exclude = ["artefacts"]

[tool.pytest.ini_options]
pythonpath = [".", "unit-tests"]
testpaths = ["unit-tests"]
